services:
  - type: web
    name: bookboard
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: bookboard-db
          property: connectionString

databases:
  - name: bookboard-db
    plan: free
    databaseName: bookboard
    user: bookboard
